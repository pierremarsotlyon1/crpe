name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install pinned Go quality tools
        working-directory: backend
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Go static and vulnerability checks
        working-directory: backend
        run: |
          golangci-lint run ./...
          govulncheck ./...
      - run: make check
      - run: make integration
      - run: make scale-smoke
      - name: Build web runtime image
        run: docker build -f web/Dockerfile -t crpe-web:ci .
      - run: npx playwright install --with-deps chromium
      - run: make browser-e2e
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: ruby mobile/generate.rb --check
      - run: make ios-test
      - name: Compile unsigned iOS release (test origin only)
        run: >-
          xcodebuild -project mobile/ios/PrepaCRPE.xcodeproj -scheme PrepaCRPE
          -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath /tmp/crpe-ios-release
          CODE_SIGNING_ALLOWED=NO CRPE_API_URL=https://api.example.test build
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle
            mobile/android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - run: make android-test android-build
      - name: Compile unsigned Android bundle (test origin only)
        run: mobile/android/gradlew -p mobile/android --no-daemon -PCRPE_API_URL=https://api.example.test :app:bundleRelease
