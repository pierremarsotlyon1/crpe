---
openapi: 3.1.0
info:
  title: Prépa Maths CRPE API
  version: 1.0.0
  description: Authentication, validated learning materials, practice, progress and teacher review.
servers:
  - url: "/"
tags:
  - name: Operations
    description: Process liveness and dependency readiness.
  - name: Configuration
    description: Public application capabilities.
  - name: Identity
    description: Identity operations.
  - name: Waitlist
    description: Waitlist operations.
  - name: Learning
    description: Learning operations.
  - name: Teacher
    description: Teacher operations.
  - name: Submissions
    description: Submissions operations.
paths:
  "/health/live":
    get:
      operationId: getLiveness
      security: []
      tags:
        - Operations
      summary: Process liveness independent of backing services
      responses:
        "200":
          description: Process is responding
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Health"
  "/health/ready":
    get:
      operationId: getReadiness
      security: []
      tags:
        - Operations
      summary: Database and schema readiness
      responses:
        "200":
          description: Instance can serve requests
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Health"
        "503":
          description: Required backing service or migration is unavailable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Unavailable"
  "/v1/config":
    get:
      operationId: getPublicConfig
      security: []
      tags:
        - Configuration
      summary: Public product flags without secrets
      responses:
        "200":
          description: Public configuration; sales disabled by default
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PublicConfig"
  "/v1/auth/request":
    post:
      operationId: requestLogin
      summary: Request login
      tags:
        - Identity
      security: []
      responses:
        "202":
          description: Request accepted
        default:
          description: Request failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
