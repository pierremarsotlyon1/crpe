name: crpe

x-backend: &backend
  image: crpe-backend:local
  build:
    context: ../backend
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 60s
  environment: &backend-env
    DATABASE_URL: postgres://crpe:crpe_local@postgres:5432/crpe?sslmode=disable
    DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-5}
    SALES_ENABLED: ${SALES_ENABLED:-false}
    HTTP_ADDR: :8080
    PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
    MOBILE_AUTH_URL: ${MOBILE_AUTH_URL:-crpemaths://auth}
    ADMIN_EMAILS: ${ADMIN_EMAILS:-enseignante@example.test}
    SMTP_ADDR: mailpit:1025
    SMTP_FROM: ${SMTP_FROM:-bonjour@example.test}
    SMTP_ALLOW_PLAINTEXT: "true"
    S3_ENDPOINT: http://s3:8333
    S3_BUCKET: crpe-development
    S3_REGION: us-east-1
    S3_ACCESS_KEY_ID: crpe_local
    S3_SECRET_ACCESS_KEY: crpe_local_secret
    # Explicit deterministic development adapter; never represented as AI.
    CORRECTION_MODE: ${CORRECTION_MODE:-local}
    CORRECTION_DAILY_LIMIT: ${CORRECTION_DAILY_LIMIT:-20}
    LLM_ENDPOINT: ${LLM_ENDPOINT:-}
    LLM_MODEL: ${LLM_MODEL:-}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_INPUT_USD_PER_MILLION: ${LLM_INPUT_USD_PER_MILLION:-}
    LLM_OUTPUT_USD_PER_MILLION: ${LLM_OUTPUT_USD_PER_MILLION:-}
    STT_ENDPOINT: ${STT_ENDPOINT:-}
    STT_MODEL: ${STT_MODEL:-}
    STT_API_KEY: ${STT_API_KEY:-}
    TTS_ENDPOINT: ${TTS_ENDPOINT:-}
    TTS_MODEL: ${TTS_MODEL:-}
    TTS_API_KEY: ${TTS_API_KEY:-}
    TTS_VOICE: ${TTS_VOICE:-}
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    BILLING_PLANS_JSON: ${BILLING_PLANS_JSON:-[]}
    STORE_ENVIRONMENT: ${STORE_ENVIRONMENT:-}
    STORE_PRODUCTS_JSON: ${STORE_PRODUCTS_JSON:-[]}
    STORE_REFERENCE_KEY: ${STORE_REFERENCE_KEY:-}
    APPLE_STORE_BUNDLE_ID: ${APPLE_STORE_BUNDLE_ID:-}
    APPLE_STORE_APP_ID: ${APPLE_STORE_APP_ID:-}
    APPLE_STORE_KEY_ID: ${APPLE_STORE_KEY_ID:-}
    APPLE_STORE_ISSUER_ID: ${APPLE_STORE_ISSUER_ID:-}
    APPLE_STORE_PRIVATE_KEY: ${APPLE_STORE_PRIVATE_KEY:-}
    APPLE_STORE_ENVIRONMENT: ${APPLE_STORE_ENVIRONMENT:-}
    GOOGLE_PLAY_PACKAGE_NAME: ${GOOGLE_PLAY_PACKAGE_NAME:-}
    GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}
    GOOGLE_PLAY_ENVIRONMENT: ${GOOGLE_PLAY_ENVIRONMENT:-}
    GOOGLE_PLAY_PUSH_AUDIENCE: ${GOOGLE_PLAY_PUSH_AUDIENCE:-}
    GOOGLE_PLAY_PUSH_EMAIL: ${GOOGLE_PLAY_PUSH_EMAIL:-}
    GOOGLE_PLAY_PUSH_SUBSCRIPTION: ${GOOGLE_PLAY_PUSH_SUBSCRIPTION:-}

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: crpe
      POSTGRES_PASSWORD: crpe_local
      POSTGRES_DB: crpe
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U crpe -d crpe"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *backend
    command: [/app/migrate]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    command: [/app/api]
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose: ["8080"]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    <<: *backend
    command: [/app/worker]
    depends_on:
      migrate:
        condition: service_completed_successfully

  proxy:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20

  s3:
    image: chrislusf/seaweedfs:4.53
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: crpe_local
      AWS_SECRET_ACCESS_KEY: crpe_local_secret
      S3_BUCKET: crpe-development
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:8333"
    volumes:
      - object-data:/data
    healthcheck:
      test: [CMD, nc, -z, 127.0.0.1, "8333"]
      interval: 3s
      timeout: 3s
      retries: 30

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_INTERNAL_URL: http://proxy:8080
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      proxy:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
      - "127.0.0.1:${SMTP_PORT:-11025}:1025"
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  object-data:
