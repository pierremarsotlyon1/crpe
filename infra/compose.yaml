name: crpe

x-backend: &backend
  image: crpe-backend:local
  build:
    context: ../backend
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 30s
  environment: &backend-env
    DATABASE_URL: postgres://crpe:crpe_local@postgres:5432/crpe?sslmode=disable
    DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-5}
    SALES_ENABLED: ${SALES_ENABLED:-false}
    HTTP_ADDR: :8080

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: crpe
      POSTGRES_PASSWORD: crpe_local
      POSTGRES_DB: crpe
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U crpe -d crpe"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *backend
    command: [/app/migrate]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    command: [/app/api]
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose: ["8080"]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    <<: *backend
    command: [/app/worker]
    depends_on:
      migrate:
        condition: service_completed_successfully

  proxy:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20

  s3:
    image: chrislusf/seaweedfs:4.53
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: crpe_local
      AWS_SECRET_ACCESS_KEY: crpe_local_secret
      S3_BUCKET: crpe-development
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:8333"
    volumes:
      - object-data:/data
    healthcheck:
      test: [CMD, nc, -z, 127.0.0.1, "8333"]
      interval: 3s
      timeout: 3s
      retries: 30

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_INTERNAL_URL: http://proxy:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      proxy:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  object-data:
