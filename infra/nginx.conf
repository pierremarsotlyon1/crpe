# Local development proxy. Production ingress must terminate TLS.
resolver 127.0.0.11 valid=2s ipv6=off;

upstream crpe_api {
    zone crpe_api 64k;
    server api:8080 resolve;
    keepalive 16;
}

server {
    listen 8080;
    server_tokens off;
    # API applies stricter per-field caps; allow PDF/audio multipart envelopes.
    client_max_body_size 21m;

    location / {
        proxy_pass http://crpe_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 80s;
        proxy_request_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        # Test-only observability of routing; omit this in production ingress.
        add_header X-Local-Upstream $upstream_addr always;
    }
}
